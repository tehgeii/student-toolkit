name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Publishing a release on github.com (with a new vX.Y.Z tag) builds and attaches the signed APK.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag (e.g. v0.9.0) to build and attach a signed APK to"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Test & build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Lint report
        if: always()
        run: |
          REPORT=$(find app/build -name 'lint-results-debug.txt' | head -1)
          if [ -n "$REPORT" ]; then cat "$REPORT"; else echo "No lint report"; fi

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: StudentToolkit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Check tag matches app version
        run: |
          VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match appVersionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # The keystore lives only in repository secrets, never in Git.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ST_KEYSTORE_BASE64, ST_KEYSTORE_PASSWORD, ST_KEY_ALIAS and ST_KEY_PASSWORD secrets to sign releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ST_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and Play Store bundle
        env:
          ST_KEYSTORE_PASSWORD: ${{ secrets.ST_KEYSTORE_PASSWORD }}
          ST_KEY_ALIAS: ${{ secrets.ST_KEY_ALIAS }}
          ST_KEY_PASSWORD: ${{ secrets.ST_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      # The .aab is only for uploading to Google Play, so it is kept as a workflow artifact
      # (visible to the repository owner) instead of next to the APK on the public release page.
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v5
        with:
          name: StudentToolkit-${{ env.TAG }}-play-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Verify signature and prepare release files
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*-release.apk)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "Verifying $APK with ${BUILD_TOOLS}apksigner"
          # apksigner exits non-zero if the APK is unsigned or the signature is invalid.
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK"
          NAME="StudentToolkit-$TAG.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          SHA=$(cut -d' ' -f1 "dist/$NAME.sha256")
          {
            echo "Aplikasi Android ringan untuk kebutuhan mahasiswa sehari-hari: nilai & IPK, deadline, Pomodoro, acak kelompok, QR, konverter, dan catatan. Offline, tanpa akun."
            echo
            echo "### Download"
            echo "**$NAME** (Android 8.0 ke atas) — ada di bagian *Assets* di bawah."
            echo
            echo "### Cara install"
            echo "1. Download file \`.apk\` lewat HP Android."
            echo "2. Buka file-nya. Jika diminta, izinkan **Install unknown apps** untuk browser / file manager."
            echo "3. Pilih **Install**. Versi berikutnya bisa langsung meng-update tanpa uninstall."
            echo
            case "$TAG" in
              v0.*) echo "> Versi 0.x = beta: fitur MVP sudah lengkap, tapi belum lolos pengujian di berbagai perangkat sungguhan." ; echo ;;
            esac
            echo "SHA-256: \`$SHA\`"
          } > dist/notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Student Toolkit ${{ env.TAG }}
          body_path: dist/notes.md
          files: |
            dist/StudentToolkit-${{ env.TAG }}.apk
            dist/StudentToolkit-${{ env.TAG }}.apk.sha256
          fail_on_unmatched_files: true
          make_latest: "true"

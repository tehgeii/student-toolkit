name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test & build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentToolkit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches app version
        run: |
          VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The keystore lives only in repository secrets, never in Git.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ST_KEYSTORE_BASE64, ST_KEYSTORE_PASSWORD, ST_KEY_ALIAS and ST_KEY_PASSWORD secrets to sign releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ST_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ST_KEYSTORE_PASSWORD: ${{ secrets.ST_KEYSTORE_PASSWORD }}
          ST_KEY_ALIAS: ${{ secrets.ST_KEY_ALIAS }}
          ST_KEY_PASSWORD: ${{ secrets.ST_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and prepare release files
        run: |
          APK=$(ls app/build/outputs/apk/release/*-release.apk)
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | grep "Signer #1 certificate SHA-256"
          NAME="StudentToolkit-$GITHUB_REF_NAME.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          SHA=$(cut -d' ' -f1 "dist/$NAME.sha256")
          {
            echo "Aplikasi Android ringan untuk kebutuhan mahasiswa sehari-hari: nilai & IPK, deadline, Pomodoro, acak kelompok, QR, konverter, dan catatan. Offline, tanpa akun."
            echo
            echo "### Download"
            echo "**$NAME** (Android 8.0 ke atas) — ada di bagian *Assets* di bawah."
            echo
            echo "### Cara install"
            echo "1. Download file \`.apk\` lewat HP Android."
            echo "2. Buka file-nya. Jika diminta, izinkan **Install unknown apps** untuk browser / file manager."
            echo "3. Pilih **Install**. Versi berikutnya bisa langsung meng-update tanpa uninstall."
            echo
            case "$GITHUB_REF_NAME" in
              v0.*) echo "> Versi 0.x = beta: fitur MVP sudah lengkap, tapi belum lolos pengujian di berbagai perangkat sungguhan." ; echo ;;
            esac
            echo "SHA-256: \`$SHA\`"
          } > dist/notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Student Toolkit ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/StudentToolkit-${{ github.ref_name }}.apk
            dist/StudentToolkit-${{ github.ref_name }}.apk.sha256
          fail_on_unmatched_files: true
          make_latest: "true"
